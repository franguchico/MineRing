# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.configuration-cache=true
# Gradle (and Fabric Loom 1.18) runs on a JDK 25; Minecraft compiles and runs on the JDK 21
# toolchain, which Gradle finds among the installed JDKs (scripts/run_minecraft.sh checks both).
# Portable Windows builds can point JAVA21_HOME at their existing JDK 21 installation.
org.gradle.java.installations.fromEnv=JAVA21_HOME

# Fabric Properties
minecraft_version=1.21.1
loader_version=0.19.5
loom_version=1.18.2

# Mod Properties
version=0.1.0-windows.6
group=dev.ermc

# Dependencies
fabric_api_version=0.116.17+1.21.1
